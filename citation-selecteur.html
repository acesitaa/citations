<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
 
	<style>
		
		body { font-family: 'Courier New', Courier, monospace;
				background-image: url('phone.jpg'); width: "150";}
		div {color: rgb(233, 33, 233);}
		.quote {font-size: 1rem;}
		.source{font-style: normal;}
		.important{background: aqua;}
		.back{color: rgb(244, 0, 207);}

		.citation {
			margin: 3rem;
			padding: 2rem;
			border: 1px solid rgb(167, 147, 187);
			border-radius: 7rem;
			aspect-ratio: 16/3;

		}

		#machin {background: linear-gradient(rgb(192, 228, 192), rgb(28, 198, 71));}
		#machina {background: linear-gradient(rgb(126, 126, 126), rgb(255, 255, 255));}

		#machine { background-image: image-set();}
		
	</style>

</head>
<body>
	
	<div class="citation" id="machina">
		<div class="source "><b>Scott Adams</b></div>
		<div class="quote style">Ideas are worthless. Execution is <i>everything.</i></div>
	</div>

	<div class="citation" id="machin">
		<div class="source back"><b>Lola</b></div>
		<div class="quote">hey, thats true!</div>
	</div>

 </body>

</html>
